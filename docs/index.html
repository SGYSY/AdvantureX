<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dceeff">
  <title>Wingman 来电 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <header><button>•••</button><b>✦ 私人提醒</b><button>字幕</button></header>
    <section class="stage">
      <div class="avatar"><img src="assets/wingman-avatar.png" alt="Wingman"></div>
      <h1>Wingman</h1><p>私人助理来电</p>
      <h2 id="status">准备开始一个模拟双击救场</h2>
      <div class="dots">● ● ●</div>
      <p id="caption">戒指双击后会发送 iMessage，并在 10 秒后显示来电。</p>
    </section>
    <section id="setup" class="setup">
      <p class="fixed">iMessage 将发送给你已连接的号码：<br><strong>“有一群母猪排队掉进水里”</strong></p>
      <label>播放录音（可选 MP3）<input id="recording" type="file" accept="audio/*"></label>
      <button id="arm" class="trigger">预备戒指来电（先点一次）</button>
      <button id="trigger" class="trigger">网页模拟戒指双击</button>
      <small id="modeNote">先点“预备”授权铃声，再在戒指上双击。需要可连接的私密 API 才会接收真实来电状态。</small>
    </section>
    <nav>
      <button id="sound" class="hidden">♬<small>开启铃声</small></button>
      <button id="decline" class="red hidden">×<small>挂断</small></button>
      <button id="answer" class="green hidden">⌕<small>接听</small></button>
    </nav>
    <p id="hint" class="hint"></p>
  </main>
  <audio id="ringtone" src="assets/ringtone.mp3" loop preload="auto"></audio>
  <audio id="voice" src="assets/default-voice-message.mp3" preload="auto"></audio>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>

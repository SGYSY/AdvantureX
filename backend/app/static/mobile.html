<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Wingman</title>
  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
  <main class="phone-shell">
      <section class="experience" aria-live="polite">
      <section class="standby-screen" id="standbyScreen"></section>

      <section class="call-screen hidden" id="callScreen">
        <button class="more-button" id="more" aria-label="更多选项">•••</button>
        <div class="more-sheet hidden" id="moreSheet"><button id="subtitle">显示字幕</button></div>
        <section class="caller">
          <div class="avatar-ring"><img src="/static/assets/wingman-avatar.png" alt="Wingman 头像"></div>
          <h1>Wingman</h1>
          <p class="call-kind">私人助理来电</p>
          <p id="status" class="status">Wingman 正在呼叫你</p>
          <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
          <p id="caption" class="caption">向右滑动来接听。</p>
        </section>
      </section>

      <section class="incoming-actions hidden" id="incomingActions" aria-label="来电操作">
        <button id="decline" class="circle-action decline hidden" aria-label="挂断"><span>×</span><small>挂断</small></button>
        <div class="answer-slider hidden" id="answerSlider" role="button" tabindex="0" aria-label="向右滑动接听">
          <span class="answer-knob" id="answerKnob">›</span><span class="answer-label">滑动来接听</span>
        </div>
      </section>
      <p id="audioHint" class="audio-hint"></p>

      <section class="audio-arm" id="audioArm" aria-label="进入体验">
        <button id="armAudio" class="enter-button">
          <span>R1</span>
          <strong>点击进入</strong>
          <small>开启全屏与来电铃声</small>
        </button>
      </section>
    </section>
  </main>
  <audio id="ringtone" src="/static/assets/ringtone.mp3" loop preload="auto"></audio>
  <audio id="voiceMessage" src="/static/assets/default-voice-message.mp3" preload="auto"></audio>
  <script src="/static/mobile.js"></script>
</body>
</html>

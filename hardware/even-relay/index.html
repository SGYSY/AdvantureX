<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Even 中继控制台</title>
    <style>
      :root {
        --bg: #131417;
        --bg-elevated: #1B1D21;
        --panel: #1E2024;
        --panel-hi: #24262B;
        --line: #303338;
        --line-soft: #282A2F;
        --text: #F4F1EA;
        --text-dim: #9BA39F;
        --text-faint: #6C736F;
        --accent: #8CE1B7;
        --accent-dim: #2D8F66;
        --accent-bg: #14312690;
        --warn: #F0CB7C;
        --warn-bg: #2E2718;
        --danger: #E39393;
        --danger-bg: #3A2323;
        --radius: 14px;
        --radius-sm: 10px;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(1200px 600px at 80% -10%, #1c2a24 0%, transparent 55%),
          radial-gradient(900px 500px at -10% 10%, #1a1d22 0%, transparent 50%),
          var(--bg);
        color: var(--text);
        font: 15px/1.6 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: contain;
        letter-spacing: 0.01em;
      }
      #app {
        min-height: 100vh;
      }
      button, input {
        font: inherit;
        color: inherit;
      }
      .shell {
        width: min(960px, 100%);
        margin: 0 auto;
        padding: 22px 18px 48px;
        box-sizing: border-box;
        display: grid;
        gap: 16px;
      }

      /* ---------- Panel ---------- */
      .panel {
        background: linear-gradient(180deg, var(--panel-hi) 0%, var(--panel) 100%);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 18px 18px;
        box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.25);
      }
      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .panel-title h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--text-dim);
      }
      .panel-title .hint {
        font-size: 12px;
        color: var(--text-faint);
      }

      /* ---------- Header ---------- */
      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .eyebrow {
        margin: 0 0 4px;
        font-size: 11px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.85;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .subtitle {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--text-dim);
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-radius: 999px;
        padding: 7px 13px;
        font-size: 12.5px;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .status-pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 8px currentColor;
      }
      .status-pill.ok { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent); }
      .status-pill.warn { background: var(--warn-bg); border-color: #A77B2E; color: var(--warn); }

      /* ---------- Controls ---------- */
      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 14px;
      }
      .field > span {
        font-size: 12px;
        color: var(--text-dim);
      }
      input[type='text'],
      input[inputmode='url'] {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        background: #121316;
        color: var(--text);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        transition: border-color 0.15s ease;
      }
      input[inputmode='url']:focus {
        outline: none;
        border-color: var(--accent-dim);
      }
      .checks {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .check-field {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 11px 13px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-sm);
        background: #17191C;
        cursor: pointer;
        user-select: none;
      }
      .check-field input {
        accent-color: var(--accent);
        width: 17px;
        height: 17px;
      }
      .check-field span { font-size: 13px; }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      button {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #2A2D32 0%, #232529 100%);
        color: var(--text);
        border-radius: var(--radius-sm);
        padding: 11px 16px;
        cursor: pointer;
        transition: transform 0.06s ease, border-color 0.15s ease, background 0.15s ease;
        font-size: 13.5px;
      }
      button:hover { border-color: #454a51; }
      button:active { transform: translateY(1px); }
      button.primary {
        border-color: var(--accent-dim);
        background: linear-gradient(180deg, #1c4634 0%, #163a2b 100%);
        color: var(--accent);
      }
      button.danger {
        border-color: #7a4646;
        background: linear-gradient(180deg, #402a2a 0%, #362323 100%);
        color: var(--danger);
      }
      button.mic-on {
        border-color: var(--accent-dim);
        background: linear-gradient(180deg, #1c4634 0%, #163a2b 100%);
        color: var(--accent);
      }

      /* ---------- Status grid ---------- */
      .status-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .status-grid > div {
        display: grid;
        gap: 6px;
        min-width: 0;
        padding: 14px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-sm);
        background: #17191C;
      }
      .metric-label {
        font-size: 11px;
        letter-spacing: 0.05em;
        color: var(--text-faint);
      }
      .status-grid strong {
        font-size: 15px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      /* ---------- Event log ---------- */
      .event-log {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
        max-height: 300px;
        overflow-y: auto;
      }
      .event-log li {
        display: grid;
        grid-template-columns: 68px minmax(120px, 200px) 1fr;
        gap: 12px;
        align-items: center;
        border-bottom: 1px solid var(--line-soft);
        padding-bottom: 8px;
      }
      .event-log li:last-child { border-bottom: none; }
      .event-log time { color: var(--text-faint); font-size: 12px; }
      .event-log strong { font-size: 14px; overflow-wrap: anywhere; }
      .event-log span { color: var(--text-dim); font-size: 12.5px; overflow-wrap: anywhere; }
      .event-log .empty { display: block; color: var(--text-faint); text-align: center; padding: 20px 0; }

      /* ---------- Diagnostics ---------- */
      .diagnostics dl { margin: 0; display: grid; gap: 12px; }
      .diagnostics div {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 14px;
        border-top: 1px solid var(--line-soft);
        padding-top: 12px;
      }
      .diagnostics div:first-child { border-top: none; padding-top: 0; }
      .diagnostics dt { color: var(--text-dim); font-size: 12.5px; }
      .diagnostics dd { margin: 0; overflow-wrap: anywhere; font-size: 12.5px; }
      .diagnostics pre {
        margin: 0;
        white-space: pre-wrap;
        color: var(--text-dim);
        font-size: 11.5px;
        line-height: 1.5;
      }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #34363A; border-radius: 999px; }
      ::-webkit-scrollbar-track { background: transparent; }

      @media (max-width: 760px) {
        .shell { padding: 16px 12px 40px; }
        h1 { font-size: 22px; }
        .status-grid { grid-template-columns: repeat(2, 1fr); }
        .event-log li { grid-template-columns: 1fr; gap: 4px; }
        .diagnostics div { grid-template-columns: 1fr; gap: 4px; }
      }
    </style>
  </head>
  <body>
    <div id="app">正在启动 Even 中继控制台…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
